[project]
name = "cv-pipeline"
version = "0.1.0"
description = "Boggle Vision CV pipeline — Python Lambda"
requires-python = "==3.12.*"
dependencies = [
    "numpy>=1.26,<2.0",
    "opencv-python-headless>=4.10,<5.0",
    "ultralytics>=8.3,<9.0",
    "onnxruntime>=1.20,<2.0",
    "torch",
    "torchvision",
    "sst",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv.sources]
sst = { git = "https://github.com/sst/sst.git", subdirectory = "sdk/python", branch = "dev" }
